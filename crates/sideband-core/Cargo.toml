[package]
name = "sideband-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ticket model, iroh transfer engine and Slack client for sideband"

[features]
# Tests that need a real n0 relay, and therefore the internet. CI never enables
# this; the default suite is fully offline.
relay-e2e = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
slack-morphism = { version = "2.25.0", features = ["hyper"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
iroh = "1.1.0"
iroh-blobs = "0.103.0"
n0-future = "0.3.2"
postcard = { version = "1.1.3", features = ["use-std"] }
data-encoding = "2.11.1"

[dev-dependencies]
tempfile = "3.27.0"

# The end-to-end tests live at the repository root, next to the README that
# specifies them, rather than under this crate.
[[test]]
name = "transfer"
path = "../../tests/transfer.rs"
